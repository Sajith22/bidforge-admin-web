# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — bidforge-admin-web
#
# The `location / { try_files ... }` block is the important part: React
# Router handles routes like /dashboard client-side, but a browser refresh
# on that URL sends a real request to Nginx for "/dashboard", which doesn't
# exist as a file. Without the fallback below, that refresh would 404 —
# same lesson learned earlier with the Flutter web app's SPA routing.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}